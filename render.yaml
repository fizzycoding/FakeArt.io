# Render Blueprint: creates the FakeArt.io game server on Render's free plan.
# In the Render dashboard choose New > Blueprint and select this repository.
services:
  - type: web
    name: fakeart-server
    runtime: docker
    plan: free
    # The region can't be changed after the service is created. Options:
    # oregon, ohio, virginia, frankfurt, singapore
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Render checks this address to know the server is up.
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      # Websites allowed to connect, besides CrazyGames, localhost and the server's own
      # address. Comma-separated; add more here or in the dashboard (Environment).
      # This one is where GitHub Pages serves the standalone game.
      - key: ALLOWED_ORIGINS
        value: https://fizzycoding.github.io
